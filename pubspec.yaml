name: kin_care_connect
description: "Kin Care Connect - family elder-care coordination: reminders, emergency contacts, plain-language medical explanations and scam warning signs."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_storage: ^14.0.1
  firebase_messaging: ^17.0.1
  firebase_app_check: ^0.5.1

  # App
  provider: ^6.1.2
  go_router: ^18.1.2
  shared_preferences: ^2.3.2
  intl: ^0.20.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  record: ^7.1.2
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
